<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial del Vehiculo - A.G.P. Chaperia y Pintura</title>
    <style>
        body {
            background-color: #121212;
            color: #f5f5f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }
        header {
            text-align: center;
            border-bottom: 2px solid #3498db;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        header h1 {
            font-size: 1.5rem;
            margin: 0 0 5px 0;
            color: #fff;
        }
        header h1 span {
            color: #3498db;
        }
        header p {
            color: #aaa;
            font-size: 0.85rem;
            margin: 0;
        }
        .info-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #252525;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #444;
        }
        .info-label {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
            font-weight: bold;
        }
        .status-badge {
            background: rgba(52, 152, 219, 0.2);
            color: #3498db;
            border: 1px solid #3498db;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
        }
        .timeline-card {
            background: #252525;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .vehicle-img {
            width: 100%;
            max-height: 320px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #555;
            margin-top: 10px;
        }
        .comment-box {
            background: #1e1e1e;
            padding: 10px;
            border-radius: 6px;
            border-left: 4px solid #3498db;
            margin-top: 10px;
        }
        .whatsapp-btn {
            display: block;
            background-color: #25d366;
            color: white;
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
            margin-top: 25px;
        }
        .whatsapp-btn:hover {
            background-color: #1ebe5d;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>A.G.P. <span>Chaperia y Pintura</span></h1>
            <p>Evolucion y seguimiento fotografico en linea</p>
        </header>

        <div id="contentSection">
            <div class="info-header">
                <div>
                    <div class="info-label">Vehiculo / Chapa</div>
                    <div class="info-value" id="lblPlate" style="color: #3498db; font-size: 1rem; font-weight: bold; margin-top: 2px;">-</div>
                </div>
                <div>
                    <div class="info-label">Estado Actual</div>
                    <div style="margin-top: 4px;"><span id="lblStatus" class="status-badge">Cargando...</span></div>
                </div>
            </div>

            <h3 style="font-size: 1rem; color: #aaa; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 5px;">Historial de Avances del Taller</h3>
            
            <div id="timelineContainer">
                <p style="color: #aaa; text-align:center;">Conectando con la nube del taller...</p>
            </div>

            <a id="btnWp" href="#" target="_blank" class="whatsapp-btn">Consultar con el Taller por WhatsApp</a>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzEwEBFw-6VrfuhGXZ_7I89Cr_IY7YJKz1vNLs77j3xdtAk4JBWyDBz3sILxjJZbEUD/exec";

        const urlParams = new URLSearchParams(window.location.search);
        const chapaBusqueda = urlParams.get('chapa') || '';

        document.getElementById('lblPlate').innerText = chapaBusqueda ? chapaBusqueda.toUpperCase() : 'VEHICULO';

        const msgWp = encodeURIComponent(`Hola A.G.P., consulto por el estado de mi vehiculo chapa ${chapaBusqueda.toUpperCase()}.`);
        document.getElementById('btnWp').href = `https://wa.me/595981409723?text=${msgWp}`;

        async function cargarHistorialCliente() {
            const timelineContainer = document.getElementById('timelineContainer');
            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                const trackings = data.tracking || [];
                const vehiculos = data.vehicles || [];

                let historialAuto = trackings.filter(t => t.plate && t.plate.toUpperCase() === chapaBusqueda.toUpperCase());
                let autoVehiculo = vehiculos.find(v => v.plate && v.plate.toUpperCase() === chapaBusqueda.toUpperCase());

                if (historialAuto.length > 0) {
                    document.getElementById('lblStatus').innerText = historialAuto[0].status;
                    timelineContainer.innerHTML = '';
                    historialAuto.forEach(item => {
                        timelineContainer.innerHTML += `
                            <div class="timeline-card">
                                <div style="font-size: 0.75rem; color: #aaa; margin-bottom: 8px; text-align: right;">${item.date || 'Reciente'}</div>
                                <p style="margin: 0 0 5px 0; font-size: 0.9rem;"><strong>Etapa:</strong> <span style="color: #3498db;">${item.status}</span></p>
                                ${item.photo ? `<img src="${item.photo}" class="vehicle-img" alt="Foto de avance">` : ''}
                                ${item.comment ? `<div class="comment-box"><p style="margin:0; font-size:0.9rem; color:#ddd;">"${item.comment}"</p></div>` : ''}
                            </div>
                        `;
                    });
                } else {
                    document.getElementById('lblStatus').innerText = autoVehiculo ? autoVehiculo.status : "En Proceso";
                    timelineContainer.innerHTML = `
                        <div class="timeline-card">
                            <p style="margin: 0 0 5px 0; font-size: 0.9rem;"><strong>Estado:</strong> <span style="color: #3498db;">${autoVehiculo ? autoVehiculo.status : "Ingreso al Taller"}</span></p>
                            <p style="color: #aaa; font-style: italic; font-size: 0.9rem;">Vehiculo registrado en A.G.P. Chaperia y Pintura. Las fotos y actualizaciones de avance se muestran aqui en tiempo real.</p>
                        </div>
                    `;
                }
            } catch (error) {
                timelineContainer.innerHTML = `<p style="color: #e74c3c; text-align:center;">Error al conectar con la nube del taller.</p>`;
            }
        }

        cargarHistorialCliente();
    </script>
</body>
</html>
