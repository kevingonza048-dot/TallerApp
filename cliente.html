<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estado de su Vehículo - A.G.P. Chapería y Pintura</title>
    <style>
        body {
            background-color: #121212;
            color: #f5f5f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }
        header {
            text-align: center;
            border-bottom: 2px solid #d9381e;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        header h1 {
            font-size: 1.5rem;
            margin: 0 0 5px 0;
            color: #fff;
        }
        header h1 span {
            color: #d9381e;
        }
        header p {
            color: #aaa;
            font-size: 0.85rem;
            margin: 0;
        }
        .info-group {
            margin-bottom: 15px;
        }
        .info-label {
            font-size: 0.8rem;
            color: #888;
            text-transform: uppercase;
            font-weight: bold;
        }
        .info-value {
            font-size: 1.1rem;
            color: #fff;
            font-weight: bold;
            margin-top: 3px;
        }
        .status-badge {
            display: inline-block;
            background: rgba(217, 56, 30, 0.2);
            color: #d9381e;
            border: 1px solid #d9381e;
            padding: 6px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.95rem;
            margin-bottom: 15px;
        }
        .vehicle-img {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #444;
            margin-bottom: 15px;
        }
        .comment-box {
            background: #252525;
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid #d9381e;
            margin-bottom: 20px;
        }
        .whatsapp-btn {
            display: block;
            background-color: #25d366;
            color: white;
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
        }
        .whatsapp-btn:hover {
            background-color: #1ebe5d;
        }
        .error-msg {
            text-align: center;
            color: #e74c3c;
            font-weight: bold;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="container" id="mainCard">
        <header>
            <h1>A.G.P. <span>Chapería y Pintura</span></h1>
            <p>Seguimiento en línea del estado de su vehículo</p>
        </header>

        <div id="contentSection">
            <div style="text-align: center;">
                <span id="lblStatus" class="status-badge">Cargando...</span>
            </div>

            <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
                <div class="info-group">
                    <div class="info-label">Vehículo</div>
                    <div class="info-value" id="lblVehicle">-</div>
                </div>
                <div class="info-group" style="text-align: right;">
                    <div class="info-label">Chapa / Patente</div>
                    <div class="info-value" id="lblPlate" style="color: #d9381e;">-</div>
                </div>
            </div>

            <div class="info-group" style="margin-bottom: 15px;">
                <div class="info-label">Propietario / Asegurado</div>
                <div class="info-value" id="lblClient">-</div>
            </div>

            <div id="imgContainer" style="text-align: center;">
                <!-- Aquí se muestra la foto -->
            </div>

            <div class="comment-box">
                <div class="info-label" style="margin-bottom: 4px;">Observaciones del Taller</div>
                <p id="lblComment" style="margin: 0; color: #ddd; font-size: 0.95rem;">-</p>
            </div>

            <a id="btnWp" href="#" target="_blank" class="whatsapp-btn">💬 Consultar con el Taller por WhatsApp</a>
        </div>

        <div id="errorSection" class="error-msg" style="display: none;">
            <p>❌ No se encontró ningún registro para este vehículo o el enlace es incorrecto.</p>
        </div>
    </div>

    <script>
        // Leer la chapa desde la URL (ej: cliente.html?chapa=ABC123)
        const urlParams = new URLSearchParams(window.location.search);
        const chapaBusqueda = urlParams.get('chapa');

        if (chapaBusqueda) {
            // Buscamos en el localStorage que se alimenta desde el panel del taller
            let trackings = JSON.parse(localStorage.getItem('agp_trackings')) || [];
            let auto = trackings.find(t => t.plate.toUpperCase() === chapaBusqueda.toUpperCase());

            if (auto) {
                document.getElementById('lblStatus').innerText = auto.status;
                document.getElementById('lblVehicle').innerText = auto.model;
                document.getElementById('lblPlate').innerText = auto.plate.toUpperCase();
                document.getElementById('lblClient').innerText = auto.client;
                document.getElementById('lblComment').innerText = auto.comment || "Trabajos en curso según cronograma.";

                const imgContainer = document.getElementById('imgContainer');
                if (auto.photo) {
                    imgContainer.innerHTML = `<img src="${auto.photo}" class="vehicle-img" alt="Foto del vehículo en taller">`;
                } else {
                    imgContainer.innerHTML = `<p style="color: #777; font-style: italic; margin-bottom: 15px;">Fotografía pendiente de actualización.</p>`;
                }

                // Enlace directo a WhatsApp del taller
                const msgWp = encodeURIComponent(`Hola A.G.P., consulto por el estado de mi vehículo chapa ${auto.plate.toUpperCase()} (${auto.model}).`);
                document.getElementById('btnWp').href = `https://wa.me/595981409723?text=${msgWp}`;

            } else {
                mostrarError();
            }
        } else {
            mostrarError();
        }

        function mostrarError() {
            document.getElementById('contentSection').style.display = 'none';
            document.getElementById('errorSection').style.display = 'block';
        }
    </script>
</body>
</html>
