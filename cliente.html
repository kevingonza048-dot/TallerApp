<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial del Vehículo - A.G.P. Chapería y Pintura</title>
    <style>
        body {
            background-color: #121212;
            color: #f5f5f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }
        header {
            text-align: center;
            border-bottom: 2px solid #3498db;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        header h1 {
            font-size: 1.5rem;
            margin: 0 0 5px 0;
            color: #fff;
        }
        header h1 span {
            color: #3498db;
        }
        header p {
            color: #aaa;
            font-size: 0.85rem;
            margin: 0;
        }
        .info-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #252525;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #444;
        }
        .info-label {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
            font-weight: bold;
        }
        .info-value {
            font-size: 1rem;
            color: #fff;
            font-weight: bold;
            margin-top: 2px;
        }
        .status-badge {
            background: rgba(52, 152, 219, 0.2);
            color: #3498db;
            border: 1px solid #3498db;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
        }
        .timeline-card {
            background: #252525;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .timeline-date {
            font-size: 0.75rem;
            color: #aaa;
            margin-bottom: 8px;
            text-align: right;
        }
        .vehicle-img {
            width: 100%;
            max-height: 320px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #555;
            margin-top: 10px;
        }
        .comment-box {
            background: #1e1e1e;
            padding: 10px;
            border-radius: 6px;
            border-left: 4px solid #3498db;
            margin-top: 10px;
        }
        .whatsapp-btn {
            display: block;
            background-color: #25d366;
            color: white;
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
            margin-top: 25px;
        }
        .whatsapp-btn:hover {
            background-color: #1ebe5d;
        }
        .error-msg {
            text-align: center;
            color: #e74c3c;
            font-weight: bold;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="container" id="mainCard">
        <header>
            <h1>A.G.P. <span>Chapería y Pintura</span></h1>
            <p>Evolución y seguimiento fotográfico en línea</p>
        </header>

        <div id="contentSection">
            <div class="info-header">
                <div>
                    <div class="info-label">Vehículo / Chapa</div>
                    <div class="info-value" id="lblPlate" style="color: #3498db;">-</div>
                </div>
                <div>
                    <div class="info-label">Estado Actual</div>
                    <div style="margin-top: 4px;"><span id="lblStatus" class="status-badge">-</span></div>
                </div>
            </div>

            <h3 style="font-size: 1rem; color: #aaa; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 5px;">📸 Historial de Avances del Taller</h3>
            
            <div id="timelineContainer">
                <!-- Historial de fotos inyectado por script -->
            </div>

            <a id="btnWp" href="#" target="_blank" class="whatsapp-btn">💬 Consultar con el Taller por WhatsApp</a>
        </div>

        <div id="errorSection" class="error-msg" style="display: none;">
            <p>❌ No se encontró ningún registro para este vehículo o el enlace es incorrecto.</p>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const chapaBusqueda = urlParams.get('chapa');

        if (chapaBusqueda) {
            let trackings = JSON.parse(localStorage.getItem('agp_tracking')) || [];
            let vehiculos = JSON.parse(localStorage.getItem('agp_vehicles')) || [];

            let historialAuto = trackings.filter(t => t.plate.toUpperCase() === chapaBusqueda.toUpperCase());
            let autoVehiculo = vehiculos.find(v => v.plate.toUpperCase() === chapaBusqueda.toUpperCase());

            if (historialAuto.length > 0 || autoVehiculo) {
                const estadoActual = historialAuto.length > 0 ? historialAuto[0].status : (autoVehiculo ? autoVehiculo.status : 'En Proceso');
                const modelo = autoVehiculo ? autoVehiculo.model : chapaBusqueda.toUpperCase();

                document.getElementById('lblStatus').innerText = estadoActual;
                document.getElementById('lblPlate').innerText = `${chapaBusqueda.toUpperCase()} (${modelo})`;

                const timelineContainer = document.getElementById('timelineContainer');
                timelineContainer.innerHTML = '';

                if (historialAuto.length > 0) {
                    historialAuto.forEach(item => {
                        const card = document.createElement('div');
                        card.className = 'timeline-card';
                        card.innerHTML = `
                            <div class="timeline-date">🕒 ${item.date || 'Fecha no registrada'}</div>
                            <p style="margin: 0 0 5px 0; font-size: 0.9rem;"><strong>Etapa:</strong> <span style="color: #3498db;">${item.status}</span></p>
                            ${item.photo ? `<img src="${item.photo}" class="vehicle-img" alt="Foto de avance">` : '<p style="color: #777; font-style: italic; font-size: 0.85rem;">Sin fotografía en este avance.</p>'}
                            ${item.comment ? `
                                <div class="comment-box">
                                    <div class="info-label" style="margin-bottom: 2px;">Nota del Taller</div>
                                    <p style="margin: 0; color: #ddd; font-size: 0.9rem;">"${item.comment}"</p>
                                </div>
                            ` : ''}
                        `;
                        timelineContainer.appendChild(card);
                    });
                } else {
                    timelineContainer.innerHTML = `<p style="color: #777; font-style: italic; text-align: center; padding: 20px;">Aún no se han cargado fotos en el historial de este vehículo.</p>`;
                }

                const msgWp = encodeURIComponent(`Hola A.G.P., consulto por el estado de mi vehículo chapa ${chapaBusqueda.toUpperCase()}.`);
                document.getElementById('btnWp').href = `https://wa.me/595981409723?text=${msgWp}`;

            } else {
                mostrarError();
            }
        } else {
            mostrarError();
        }

        function mostrarError() {
            document.getElementById('contentSection').style.display = 'none';
            document.getElementById('errorSection').style.display = 'block';
        }
    </script>
</body>
</html>
